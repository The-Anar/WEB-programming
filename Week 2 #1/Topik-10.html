<body>
  <!-- Inline elements flow on the same line -->
  <p>
    Normal text,
    <strong>Made</strong>,
    <em>BY</em>,
    <a href="#">BATSUREN </a>,
    and <span class="highlight">ANAR</span>
    all sit on ONE line.
  </p>

  <!-- span is invisible by default — CSS gives it style -->
  <style>
    .highlight { background: rgb(255, 81, 0); color: black; padding: 2px 4px; }
  </style>

  <!-- Wrong: block element inside inline -->
  <!-- <span><p>text</p></span> ← BAD! -->
</body>

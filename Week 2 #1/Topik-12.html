<body>
  <!-- em changes meaning based on which word is stressed -->
  <p>hello <em>guys</em> welcome !.</p>
  <p><em>You</em> must submit by Friday. (Made by BATSUREN ANAR)</p>

  <!-- i for terms/titles, no semantic emphasis -->
  <p>The element <i>em</i> stands for emphasis.</p>
  <p>In Korean, <i>학번</i> means student ID number.</p>

  <!-- code for technical/code terms -->
  <p>Use the <code>font-size</code> property to change text size.</p>
</body>

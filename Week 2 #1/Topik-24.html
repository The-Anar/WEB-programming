<body>
  <!-- BLOCK elements — each starts a new line -->
  <h2>Heading (block)</h2>
  <p>Paragraph (block)</p>
  <div>Div (block)</div>

  <!-- INLINE elements — flow on one line -->
  <p>
    This paragraph contains
    <strong>bold (inline)</strong>,
    <em>italic (inline)</em>,
    <a href="#">a link (inline)</a>, and
    <span style="color:teal">coloured text (inline)</span>
    — all on the same line.
  </p>

  <!-- CORRECT: inline inside block -->
  <p><strong>MADE</strong> BY Batsuren Anar</p>

  <!-- WRONG: block inside inline -->
  <!-- <span><p>Bad</p></span> ← INVALID! -->
</body>

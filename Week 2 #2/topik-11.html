<article>
  <h2>HTML Figures and Captions</h2>

  <p>
    The <code>figure</code> element groups related content,
    such as images and tables. The <code>figcaption</code>
    element adds a caption to explain that content.
  </p>

  <!-- Alt describes the image for screen readers -->
  <!-- Figcaption provides a visible caption -->
  <figure>
    <img src="flexbox-demo.gif"
         alt="Animation showing flex items rearranging when flex-direction changes"
         width="500">
    <figcaption>
      Figure 1: Flex direction controls the main axis orientation.
    </figcaption>
  </figure>

  <!-- Figcaption can appear before or after the content -->
  <figure>
    <figcaption>
      Table 1: Browser support for HTML5 semantic elements.
    </figcaption>

    <table>
      <tr>
        <th>Element</th>
        <th>Chrome</th>
        <th>Firefox</th>
        <th>Safari</th>
      </tr>
      <tr>
        <td>&lt;main&gt;</td>
        <td>26+</td>
        <td>21+</td>
        <td>7+</td>
      </tr>
      <tr>
        <td>&lt;article&gt;</td>
        <td>6+</td>
        <td>4+</td>
        <td>5+</td>
      </tr>
    </table>
  </figure>

  <p>
    <mark>Made by: Batsuren Anar | Student ID: 202637018</mark>
  </p>
</article>

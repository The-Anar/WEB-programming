<body>
  <h2>Quoting on the Web</h2>

  <p>
    Tim Berners-Lee once said,
    <q cite="https://www.w3.org/People/Berners-Lee/FAQ.html">
      The web is for everyone.
    </q>
  </p>

  <!-- The browser automatically adds quotation marks around q content -->
  <p>
    As I learned in Web Programming,
    <q>semantic HTML is the foundation of accessible webpages.</q>
  </p>

  <!-- Do not add quotation marks manually inside q -->
  <!-- Incorrect: <q>"The web is for everyone."</q> -->

  <p>
    <mark>Made by: Batsuren Anar | Student ID: 202637018</mark>
  </p>
</body>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  .card {
    width: 280px;
    height: 180px;
    background: white;
    border: 2px solid #0f766e;
    border-radius: 12px;
    position: relative;
    margin: 40px;
  }

  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #259f94;
    color: white;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">67% SALE</span>
    <p style="padding:16px">Card content here</p>
  </div>
</body>
</html>

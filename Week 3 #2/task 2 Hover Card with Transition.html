<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  body { padding: 40px; background: #f0fdfa; }
  .card {
    background: white;
    border: 2px solid #14b8a6;
    border-radius: 12px;
    padding: 24px;
    width: 240px;
    color: #0f766e;
    font-size: 16px;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 20px rgba(20, 184, 166, 0.4);
  }
</style>
</head>
<body>
  <div class="card">Anar's Hover Card</div>
</body>
</html>

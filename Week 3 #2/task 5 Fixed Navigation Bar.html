<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; }

  .nav {
    position: fixed;
    top: 0;
    width: 100%;
    background: #1e293b;
    display: flex;
    justify-content: space-between;
    padding: 16px 24px;
  }

  .nav-logo {
    color: white;
    font-weight: bold;
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    gap: 20px;
  }

  .nav-links a {
    color: #d1d5db;
    text-decoration: none;
  }

  .nav-links a:hover {
    color: #14b8a6;
  }

  .content { padding-top: 70px; }
  .section  { height: 300px; padding: 40px; font-size: 18px; }
</style>
</head>
<body>
  <nav class="nav">
    <a href="#" class="nav-logo">Anar's WebPro</a>
    <div class="nav-links">
      <a href="#s1">Home</a>
      <a href="#s2">Topics</a>
      <a href="#s3">Practice</a>
    </div>
  </nav>

  <div class="content">
    <div class="section" id="s1" style="background:#f0fdfa">Welcome to Anar's WebPro page</div>
    <div class="section" id="s2" style="background:#ccfbf1">Learning Web Development</div>
    <div class="section" id="s3" style="background:#99f6e4">CSS Practice</div>
  </div>
</body>
</html>

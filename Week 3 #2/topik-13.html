
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Shape & Shadow Lab</title>
  <style>
    body {
      background: #f5f3ff;
      padding: 30px;
      font-family: sans-serif;
      color: #312e81;
    }

    h2 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    /* Border-radius variety */
    .r-none   { border-radius: 0; }
    .r-sm     { border-radius: 8px; }
    .r-lg     { border-radius: 24px; }
    .r-pill   { border-radius: 100px; }

    .r-circle {
      border-radius: 50%;
      width: 80px;
      height: 80px;
      line-height: 80px;
      text-align: center;
      padding: 0;
    }

    /* Box-shadow variety */
    .s-sm {
      box-shadow: 0 3px 8px rgba(49, 46, 129, 0.12);
    }

    .s-md {
      box-shadow: 0 6px 16px rgba(49, 46, 129, 0.18);
    }

    .s-lg {
      box-shadow: 0 10px 28px rgba(49, 46, 129, 0.25);
    }

    .s-col {
      box-shadow: 0 5px 20px rgba(147, 51, 234, 0.45);
    }

    .s-in {
      box-shadow: inset 0 3px 8px rgba(49, 46, 129, 0.25);
      background: #ddd6fe;
      color: #312e81;
    }

    .box {
      background: #5b21b6;
      color: white;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: bold;
    }

    .circle-box {
      background: #a855f7;
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    .label {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .credit {
      margin-top: 30px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <h2>1. Border Radius Lab</h2>
  <p class="label">Same basic box, different corner shapes</p>

  <div class="row">
    <div class="box r-none">Square</div>
    <div class="box r-sm">8px</div>
    <div class="box r-lg">24px</div>
    <div class="box r-pill">Pill Shape</div>
    <div class="box r-circle circle-box">50%</div>
  </div>

  <h2>2. Box Shadow Lab</h2>
  <p class="label">Compare the depth and direction of each shadow</p>

  <div class="row">
    <div class="box r-sm s-sm">Small</div>
    <div class="box r-sm s-md">Medium</div>
    <div class="box r-sm s-lg">Large</div>
    <div class="box r-sm s-col">Purple Shadow</div>
    <div class="box r-sm s-in">Inset Shadow</div>
  </div>

  <p class="credit">
    <mark>Made by: Batsuren Anar | Student ID: 202637018</mark>
  </p>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with textContent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            background-color: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 15px #00000015;
        }

        #title {
            color: #4338ca;
            font-size: 28px;
        }

        #output {
            background-color: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        button {
            background-color: #4338ca;
            color: white;
            border: none;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 7px;
            cursor: pointer;
        }

        mark {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Hello, Anar!</h1>

        <p>Click a button to see how <code>textContent</code> works.</p>

        <button onclick="readText()">Read Text</button>
        <button onclick="changeText()">Change Text</button>
        <button onclick="showHTMLAsText()">Show HTML as Text</button>

        <h3>Current text:</h3>
        <p id="output">Hello, Anar!</p>

        <mark>Made by: Batsuren Anar | Student ID: 202637018</mark>
    </div>

    <script>
        const title = document.querySelector('#title');
        const output = document.querySelector('#output');

        // READ the current text
        function readText() {
            console.log(title.textContent);
            output.textContent = title.textContent;
        }

        // WRITE new text
        function changeText() {
            title.textContent = 'Welcome to Web Programming!';
            output.textContent = title.textContent;
        }

        // HTML tags become plain text, not actual HTML
        function showHTMLAsText() {
            title.textContent = '<b>This will NOT be bold</b>';
            output.textContent = title.textContent;
        }
    </script>
</body>
</html>

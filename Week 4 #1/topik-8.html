
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eff6ff;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px #1e40af18;
        }

        h1 {
            color: #1d4ed8;
            margin-top: 0;
        }

        p {
            color: #64748b;
        }

        label {
            display: block;
            text-align: left;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            overflow-wrap: anywhere;
        }

        #message.error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        #message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        mark {
            display: inline-block;
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>Welcome Back!</h1>
        <p>Enter your email to try JavaScript form validation.</p>

        <form id="login-form">
            <label for="email">Email Address</label>
            <input
                type="text"
                id="email"
                placeholder="you@example.com"
            >

            <button type="submit">Submit Form</button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <mark>Made by: Batsuren Anar | Student ID: 202637018</mark>
    </div>

    <script>
        const form = document.querySelector('#login-form');
        const emailInput = document.querySelector('#email');
        const message = document.querySelector('#message');

        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Stops the page reload!

            const email = emailInput.value.trim();

            // Validate the email
            if (!email.includes('@') || email.startsWith('@') ||
                email.endsWith('@')) {
                showError('Please enter a valid email.');
            } else {
                loginUser(email);
            }
        });

        function showError(text) {
            message.textContent = text;
            message.className = 'error';
        }

        function loginUser(email) {
            // Demo only: no real login or account authentication
            message.textContent = 'Form submitted successfully for: ' + email;
            message.className = 'success';
        }
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Delegation Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            padding: 35px 18px;
            text-align: center;
        }

        .container {
            max-width: 520px;
            margin: auto;
            padding: 28px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 20px #0f172a12;
        }

        h1 {
            color: #0f766e;
        }

        .add-row {
            display: flex;
            gap: 8px;
            margin: 20px 0;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 13px;
            cursor: pointer;
        }

        #add-btn {
            background: #0f766e;
            color: white;
        }

        #todo-list {
            list-style: none;
            padding: 0;
            text-align: left;
        }

        #todo-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px;
            margin: 9px 0;
            background: #f0fdfa;
            border-left: 4px solid #14b8a6;
            border-radius: 7px;
        }

        .delete-btn {
            flex-shrink: 0;
            background: #fee2e2;
            color: #b91c1c;
        }

        #status {
            color: #64748b;
            font-size: 14px;
        }

        mark {
            display: inline-block;
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <p>Add tasks and delete them using event delegation.</p>

        <div class="add-row">
            <input id="task-input" type="text" placeholder="Enter a new task">
            <button id="add-btn">Add Task</button>
        </div>

        <ul id="todo-list">
            <li>
                <span>Study JavaScript</span>
                <button class="delete-btn">Delete</button>
            </li>
            <li>
                <span>Practice HTML and CSS</span>
                <button class="delete-btn">Delete</button>
            </li>
            <li>
                <span>Review event listeners</span>
                <button class="delete-btn">Delete</button>
            </li>
        </ul>

        <p id="status">Tasks remaining: 3</p>

        <mark>Made by: Batsuren Anar | Student ID: 202637018</mark>
    </div>

    <script>
        const list = document.querySelector('#todo-list');
        const input = document.querySelector('#task-input');
        const addBtn = document.querySelector('#add-btn');
        const status = document.querySelector('#status');

        // ONE listener on the parent handles all delete buttons
        list.addEventListener('click', (e) => {
            if (e.target.matches('.delete-btn')) {
                e.target.parentElement.remove();
                updateCount();
            }
        });

        // Add new list items
        function addTask() {
            const task = input.value.trim();

            if (task === '') return;

            const li = document.createElement('li');
            const span = document.createElement('span');
            const button = document.createElement('button');

            span.textContent = task;
            button.textContent = 'Delete';
            button.classList.add('delete-btn');

            li.append(span, button);
            list.appendChild(li);

            input.value = '';
            input.focus();
            updateCount();
        }

        addBtn.addEventListener('click', addTask);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        function updateCount() {
            status.textContent =
                'Tasks remaining: ' + list.querySelectorAll('li').length;
        }
    </script>
</body>
</html>

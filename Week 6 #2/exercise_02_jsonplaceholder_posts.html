<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JSONPlaceholder Posts</title><style>
:root{--bg:#171e31;--panel:#222e47;--text:#f1f1ff;--muted:#b5c1dd;--border:#8797c9;--shadow:#0b0e18;--hero1:#30234d;--hero2:#503b78;--accent:#c8b5ff}
body.light{--bg:#f3f3fc;--panel:#fff;--text:#20213a;--muted:#626b86;--border:#9ba7d0;--shadow:#d4d5e3;--hero1:#e9dcff;--hero2:#d6c4fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Arial,sans-serif;transition:.2s}
header{max-width:1420px;margin:auto;padding:24px 34px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #35405a}
.brand{font-size:19px;font-weight:900;letter-spacing:1px}.actions{display:flex;gap:12px;flex-wrap:wrap}
a{color:inherit;text-decoration:none}button,.button{background:var(--panel);color:var(--text);border:2px solid var(--border);border-radius:16px;padding:10px 15px;font-weight:bold;cursor:pointer;display:inline-block}
button:hover,.button:hover{transform:translateY(-2px)}main{max-width:1420px;margin:auto;padding:28px 34px 55px}
.hero{background:linear-gradient(115deg,var(--hero1),var(--hero2));border:1px solid #574578;border-radius:30px;padding:30px 36px;margin:0 0 28px;box-shadow:8px 8px 0 var(--shadow)}
.kicker{font-size:13px;letter-spacing:3px;font-weight:900}h1{font-size:clamp(36px,5vw,58px);line-height:1.15;margin:12px 0}
.description{margin:12px 0}.student{font-weight:900;letter-spacing:1px;margin:20px 0 0}.archive{letter-spacing:3px;font-size:13px;font-weight:900;margin-top:30px}
.heading-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{font-size:32px;margin:0 0 20px}
.count{border-radius:30px;background:var(--panel);border:1px solid #35405a;padding:9px 17px;font-weight:900;font-size:13px}
.divider{display:flex;align-items:center;gap:14px;font-weight:bold;margin:24px 0 14px}.divider:after{content:"";height:2px;background:#354664;flex:1}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.work{background:var(--panel);border:2px solid var(--border);border-radius:22px;padding:20px;box-shadow:4px 5px 0 var(--shadow);transition:.2s}
.card:hover{transform:translateY(-3px)}.card h3{margin:0 0 8px;font-size:19px}.card p{color:var(--muted);margin:0 0 15px}.card .button{padding:8px 13px;border-radius:25px;font-size:13px}
.work{max-width:900px;margin:0 auto}.work h2{margin-top:0}.work p{color:var(--muted)}.result{margin:18px 0;padding:18px;border:1px solid #354664;border-radius:16px;background:var(--bg);white-space:pre-wrap;overflow-wrap:anywhere}
input{background:var(--bg);color:var(--text);border:2px solid var(--border);border-radius:12px;padding:11px 13px;max-width:100%;font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.small{font-size:13px;color:var(--muted)}
footer{max-width:1420px;margin:auto;padding:22px 34px;border-top:1px solid #35405a;color:var(--muted);font-size:13px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){header{padding:18px;align-items:flex-start;flex-direction:column}main{padding:22px 16px}.hero{padding:23px 20px;border-radius:22px}.grid{grid-template-columns:1fr}h2{font-size:27px}footer{padding:20px 16px}}
</style></head>
<body><header><a class="brand" href="index.html">ANAR · WEB PROGRAMMING</a><div class="actions"><a class="button" href="index.html">← Week 6 #2</a><button id="themeToggle" type="button">☀️ Light mode</button></div></header>
<main>
<div class="work"><h2>📰 JSONPlaceholder Posts</h2><p>Load the first five sample posts from JSONPlaceholder.</p><button id="load">Load Posts</button><div id="status" aria-live="polite" class="small"></div><div id="result" class="result">Posts will appear here.</div></div>
</main><footer>Made by Batsuren Anar · Student ID: 202637018</footer><script>
const toggle=document.getElementById("themeToggle");
if(toggle){toggle.addEventListener("click",()=>{document.body.classList.toggle("light");toggle.textContent=document.body.classList.contains("light")?"🌙 Dark mode":"☀️ Light mode";});}

document.getElementById('load').addEventListener('click',async()=>{let out=document.getElementById('result'),s=document.getElementById('status');s.textContent='Loading…';try{let r=await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();out.innerHTML=d.map(p=>'<article><h3>'+p.id+'. '+p.title+'</h3><p>'+p.body+'</p></article>').join('');s.textContent='Loaded '+d.length+' posts.'}catch(e){out.textContent='Could not load posts. Please try again.';s.textContent='Request failed.'}});
</script></body></html>

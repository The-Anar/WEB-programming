<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
    }

    nav {
      background-color: #1e293b;
      display: flex;
      justify-content: space-between;
      padding: 16px 24px;
    }

    .logo {
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
    }

    .nav-links a:hover {
      color: #10B981;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#" class="logo">WebPro</a>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Topics</a>
      <a href="#">Quiz</a>
      <a href="#">About</a>
    </div>
  </nav>
</body>
</html>

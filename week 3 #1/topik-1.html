<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batsuren Anar — CSS Demo</title>

  <style>
    /* CSS controls the appearance of the webpage */
    body {
      font-family: sans-serif;
      background: #f0f9ff;
      color: #1e293b;
    }

    h1 {
      color: #15803d;
      font-size: 2rem;
    }

    p {
      max-width: 60ch;
      line-height: 1.7;
    }

    mark {
      background-color: #ffd700;
      color: #000;
      padding: 3px 6px;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <h1>Hello, CSS!</h1>

  <p>
    This heading is green and the background is light blue.
    CSS controls the appearance of HTML elements.
  </p>

  <p>
    <mark>Made by: Batsuren Anar | Student ID: 202637018</mark>
  </p>
</body>
</html>

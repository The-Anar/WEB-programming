<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .normal  { font-style: normal; }
    .italic  { font-style: italic; }
    .oblique { font-style: oblique; } /* artificial slant */

    /* Practical use: labels, captions, quotes */
    blockquote {
      font-style: italic;
      color: #64748b;
      border-left: 3px solid #10B981;
      padding-left: 16px;
    }

    .caption {
      font-style: italic;
      font-size: 0.875rem;
      color: #94a3b8;
    }

    /* Small personal touch */
    p:hover {
      color: #15803d;
    }

    mark {
      background-color: #ffd700;
      padding: 3px 6px;
    }
  </style>
</head>
<body>
  <p class="normal">Normal — upright text</p>
  <p class="italic">Italic — true italic letterforms</p>
  <p class="oblique">Oblique — artificially slanted</p>
  <br>
  <blockquote>"CSS is the language of the web's visual layer."</blockquote>
  <p class="caption">Figure 1: Example of a styled blockquote</p>

  <p><mark>Made by: Batsuren Anar | Student ID: 202637018</mark></p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .box { padding: 16px; margin: 8px 0; border: 2px solid #10B981; }

    .hidden-none       { display: none; }           /* gone — no space */
    .hidden-visibility { visibility: hidden; }       /* hidden but space kept */
    .hidden-opacity    { opacity: 0; }               /* transparent, space kept */

    /* Small personal touch */
    .box:hover {
      border-color: #047857;
    }

    mark {
      background-color: #ffd700;
      padding: 3px 6px;
    }
  </style>
</head>
<body>
  <div class="box">Box 1 — visible</div>
  <div class="box hidden-none">Box 2 — display:none (you cannot see this)</div>
  <div class="box">Box 3 — visible (no gap above from box 2!)</div>
  <div class="box hidden-visibility">Box 4 — visibility:hidden (space kept)</div>
  <div class="box">Box 5 — there IS a gap above from box 4</div>
  <hr>

  <!-- Toggle with JavaScript -->
  <button onclick="document.getElementById('msg').style.display = document.getElementById('msg').style.display === 'none' ? 'block' : 'none'">
    Toggle Message
  </button>
  <div id="msg" class="box" style="display:none">УУУхааааай!!!!</div>

  <p><mark>Made by: Batsuren Anar | Student ID: 202637018</mark></p>
</body>
</html>

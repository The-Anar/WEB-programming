<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS ID Selectors - Batsuren Anar</title>

  <style>
    /* ID selector — targets the ONE element with id="main-title" */
    #main-title {
      color: #15803d;
      font-size: 2.5rem;
      border-left: 5px solid #10B981;
      padding-left: 12px;
    }

    #hero-banner {
      background: #ecfdf5;
      padding: 40px;
      border-radius: 12px;
    }

    /* My small customization */
    #hero-banner:hover {
      background: #d1fae5;
    }

    mark {
      background-color: #ffd700;
      padding: 3px 6px;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <div id="hero-banner">
    <h1 id="main-title">CSS Introduction</h1>
    <p>This heading is styled via its unique id.</p>
    <p>I'm learning how ID selectors target specific elements.</p>
    <p><mark>Made by: Batsuren Anar | Student ID: 202637018</mark></p>
  </div>
</body>
</html>

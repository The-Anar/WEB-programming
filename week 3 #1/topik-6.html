<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      margin: 10px;
    }

    .featured {          /* extra class layered on top */
      border-color: #10B981;
      background: #ecfdf5;
    }

    .large { font-size: 1.25rem; }

    /* Small personal touch */
    .card:hover {
      box-shadow: 0 2px 8px #cbd5e1;
    }

    mark {
      background-color: #ffd700;
      padding: 3px 6px;
    }
  </style>
</head>
<body>
  <div class="card">Plain card</div>
  <div class="card featured">Featured card (two classes)</div>
  <div class="card featured large">Featured + large (three classes)</div>

  <p><mark>Made by: Batsuren Anar | Student ID: 202637018</mark></p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* Type selectors — apply to every element of that type */
    h1 { color: #15803d; }
    h2 { color: #1d4ed8; font-size: 1.4rem; }
    p  { font-size: 1rem; line-height: 1.7; color: #334155; }
    a  { color: #10B981; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Combination: only <p> with class="lead" */
    p.lead { font-size: 1.2rem; font-weight: 500; }

    mark {
      background-color: #ffd700;
      padding: 3px 6px;
    }
  </style>
</head>
<body>
  <h1>Main Heading — green</h1>
  <h2>Sub Heading — blue</h2>
  <p class="lead">Lead paragraph (larger).</p>
  <p>Normal paragraph. <a href="#">A link.</a></p>

  <p><mark>Made by: Batsuren Anar | Student ID: 202637018</mark></p>
</body>
</html>

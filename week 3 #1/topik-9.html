<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .banner {
      background-color: #15803d;
      color: white;
      padding: 20px 30px;
      border-radius: 8px;
    }

    .warning {
      background-color: #fef3c7;   /* amber-50 */
      color: #92400e;              /* amber-800 */
      padding: 12px 16px;
      border-left: 4px solid #f59e0b;
    }

    .dark-card {
      background-color: #1e293b;
      color: #e2e8f0;
      padding: 20px;
    }

    /* Small personal touch */
    .banner:hover,
    .warning:hover,
    .dark-card:hover {
      transform: translateY(-2px);
    }

    mark {
      background-color: #ffd700;
      padding: 3px 6px;
    }
  </style>
</head>
<body>
  <div class="banner">Green banner — white text (high contrast)</div>
  <br>
  <div class="warning">⚠ Warning box — amber background</div>
  <br>
  <div class="dark-card">Dark card — light text</div>

  <p><mark>Made by: Batsuren Anar | Student ID: 202637018</mark></p>
</body>
</html>

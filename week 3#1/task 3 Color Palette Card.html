<!DOCTYPE html>
<html lang="en">
    <head> 
        <meta charset="UTF-8">
        <style>
            .palete {
                display flex;
                gap 12px;
                padding: 20px;
                background-color: # f1f5f9;
            }
            .swatch {
                width: 100px;
                height: 100px;
                border-radius: 8px;
                display: flex; 
                align-items: center; 
                justify-content: center;
                color: white;
                font weight: bold;
                font-size: 13px;
                font-family: monospace;
                 
            }
            .c1 {
                background: #EF4444;

            }
            .c2 {
                background: #F59E0B;
            
            }
            .C3 {
                background: #10B981;
            }
            .C4 {
                background: #3B82F6;
            }
            C5 {
                background: #8B5CF6;
            }
        </style>
        </head>
        <body>
            <div class="palete">
                <div class="swatch c1">Red</div>
                <div class="swatch c2">Orange</div>
                <div class="swatch C3">Green</div>
                <div class="swatch C4">Blue</div>
                <div class="swatch C5">Purple</div>
            </div>
        </body>
        </html>

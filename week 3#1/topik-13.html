<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; font-size: 1.1rem; }

    /* Named values */
    .normal { font-weight: normal; }  /* = 400 */
    .bold   { font-weight: bold; }    /* = 700 */

    /* Numeric values */
    .w300 { font-weight: 300; }  /* Light */
    .w400 { font-weight: 400; }  /* Regular */
    .w500 { font-weight: 500; }  /* Medium */
    .w600 { font-weight: 600; }  /* SemiBold */
    .w700 { font-weight: 700; }  /* Bold */
    .w900 { font-weight: 900; }  /* Black */

    /* Small personal touch */
    p:hover {
      color: #15803d;
    }

    mark {
      background-color: #ffd700;
      padding: 3px 6px;
    }
  </style>
</head>
